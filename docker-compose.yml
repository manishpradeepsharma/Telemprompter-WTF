services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: teleprompter-api
    restart: unless-stopped
    ports:
      - '4322:4322'
      - '4323:4323'
    environment:
      - PORT=4322
      - NODE_ENV=production
      - WEB_HOST=teleprompter
      - WEB_PORT=8080
      - LAN_IP=${LAN_IP:-}
      - HOST_IP=${HOST_IP:-}
    volumes:
      - ./data:/app/data
      - ./filestore:/app/filestore
      - ./ssl:/app/ssl:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4322/api/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  teleprompter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GA_MEASUREMENT_ID: ${PUBLIC_GA_MEASUREMENT_ID:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
        PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL:-}
        PUBLIC_GOOGLE_SITE_VERIFICATION: ${PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        PUBLIC_BING_SITE_VERIFICATION: ${PUBLIC_BING_SITE_VERIFICATION:-}
    container_name: teleprompter-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:8080'
      - '4321:8080'
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
