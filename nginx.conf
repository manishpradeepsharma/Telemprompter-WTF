server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # Proxy API requests to backend Node server
  location /api/ {
    proxy_pass http://api:4322/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 500M;
    proxy_request_buffering off;
  }

  # Proxy uploaded recordings from filestore
  location /filestore/ {
    proxy_pass http://api:4322/filestore/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 500M;
  }

  # Canonical health probe
  location = /health {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 'ok\n';
  }

  # Compatibility probe retained for older deploy scripts
  location = /health.txt {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /health.txt =404;
  }

  location ^~ /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /models/ {
    include /etc/nginx/snippets/security-headers.conf;
    types {
      application/javascript mjs;
      application/wasm wasm;
      application/json json;
      text/plain txt;
      application/octet-stream onnx;
    }
    gzip off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges "bytes";
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|llms\.txt|sitemap.*\.xml)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri.html $uri/index.html $uri =404;
  }

  error_page 404 /404.html;
}
